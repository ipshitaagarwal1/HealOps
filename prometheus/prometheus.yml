# Short intervals so the demo reacts within seconds. In production 15s-60s is typical:
# shorter intervals cost more CPU, storage, and network on large fleets.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: demo
    static_configs:
      - targets: ['service-a:8080', 'service-b:8080']

  - job_name: agent
    static_configs:
      - targets: ['agent:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
